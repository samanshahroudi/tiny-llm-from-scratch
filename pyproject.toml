[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm-fa"
version = "0.1.0"
description = "Persian notebook-first course: an inspectable GPT, training, evaluation and serving"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.7.1", "numpy==2.2.6", "fastapi==0.115.12",
  "pydantic==2.11.5", "uvicorn==0.34.2",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab==4.4.3", "ipykernel==6.29.5", "nbformat==5.10.4",
  "nbclient==0.10.2", "matplotlib==3.10.3", "httpx==0.28.1",
]
dev = ["pytest==8.3.5", "httpx==0.28.1"]
hf = ["datasets==3.6.0", "huggingface-hub==0.32.4", "tiktoken==0.9.0",
      "sentence-transformers==4.1.0", "transformers==4.52.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
